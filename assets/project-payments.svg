<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 190" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo do simulador de pagamentos</title>
  <desc id="desc">Pix, débito e crédito passam por validações antes de um resultado aprovado ou recusado.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0D1117"/><stop offset="1" stop-color="#1B2433"/></linearGradient><linearGradient id="line"><stop stop-color="#22C55E"/><stop offset="1" stop-color="#38BDF8"/></linearGradient></defs>
  <style>@keyframes travel{to{stroke-dashoffset:-48}}@keyframes pulse{0%,100%{opacity:.68;filter:drop-shadow(0 0 1px #38BDF8)}50%{opacity:1;filter:drop-shadow(0 0 7px #38BDF8)}}.route{stroke-dasharray:12 8;animation:travel 2.8s linear infinite}.node{animation:pulse 2.4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.route,.node{animation:none}}</style>
  <rect width="1100" height="190" rx="18" fill="url(#bg)"/>
  <path class="route" d="M205 95H895" fill="none" stroke="url(#line)" stroke-width="3"/>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" fill="#F0F6FC">
    <g class="node"><rect x="45" y="50" width="190" height="90" rx="14" fill="#161B22" stroke="#EA4B71"/><text x="140" y="88" font-size="18" font-weight="700">Payment method</text><text x="140" y="116" font-size="14" fill="#9DA7B3">Pix · Debit · Credit</text></g>
    <g class="node" style="animation-delay:.35s"><rect x="315" y="50" width="190" height="90" rx="14" fill="#161B22" stroke="#ED8B00"/><text x="410" y="88" font-size="18" font-weight="700">BigDecimal</text><text x="410" y="116" font-size="14" fill="#9DA7B3">Monetary values</text></g>
    <g class="node" style="animation-delay:.7s"><rect x="585" y="50" width="190" height="90" rx="14" fill="#161B22" stroke="#6DB33F"/><text x="680" y="88" font-size="18" font-weight="700">Validation</text><text x="680" y="116" font-size="14" fill="#9DA7B3">Rules and limits</text></g>
    <g class="node" style="animation-delay:1.05s"><rect x="855" y="50" width="190" height="90" rx="14" fill="#161B22" stroke="#38BDF8"/><text x="950" y="88" font-size="18" font-weight="700">Result</text><text x="950" y="116" font-size="14" fill="#9DA7B3">Approved · Declined</text></g>
  </g>
</svg>

